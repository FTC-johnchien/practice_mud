spring:
  application:
    name: htmlmud

  # 虛擬執行緒優化 (JDK 25)
  threads:
    virtual:
      enabled: true

  # 靜態資源快取配置 (避免瀏覽器快取舊的 CSS / JS)
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          must-revalidate: true

server:
  port: 8080

app:
  websocket:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080

game:
  defaults:
    player:
      initial-hp: 200
      initial-mp: 100
      initial-coin: 100
      spawn-room-id: "newbie_village:inn"
      respawn-room-id: "newbie_village:cemetery"
  combat:
    default-gcd-ms: 1500
    base-hit-chance: 0.80
    dex-hit-modifier: 0.01
    unarmed-attack-speed-ms: 2000
    multi-attack-min-interval-ms: 450
    multi-attack-max-interval-ms: 551
  regen:
    tick-modulo: 150
    hp-percent: 0.05
    mp-percent: 0.01
