spring:
  application:
    name: htmlmud

  # 虛擬執行緒優化 (JDK 25)
  threads:
    virtual:
      enabled: true

  # 靜態資源快取配置 (避免瀏覽器快取舊的 CSS / JS)
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          must-revalidate: true

server:
  port: 8080

app:
  websocket:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080
