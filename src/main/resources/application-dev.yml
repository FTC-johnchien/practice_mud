spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./db/muddb;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ${H2_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      pool-name: MudHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

app:
  websocket:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080