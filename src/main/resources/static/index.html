<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>道祖是克蘇魯 - DRPG 靈境探索</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.1.0/ansi_up.min.js"></script>
</head>
<body>

  <div class="game-container">
    <!-- 頂部資訊列：模式提示與陣法靈威槽 -->
    <header class="top-nav-bar">
      <div id="control-mode-badge" class="mode-badge mode-exploring">
        🎮 步進探索模式 (按 W/A/S/D 移動，按 / 或 Enter 輸入指令)
      </div>

      <div class="top-nav-center-actions">
        <button class="top-nav-btn btn-save-quick" onclick="openSaveModal('save')" title="儲存進度 (F5)">💾 存檔</button>
        <button class="top-nav-btn btn-load-quick" onclick="openSaveModal('load')" title="載入進度 / 開闢新道途">📂 讀檔 / 新局</button>
      </div>

      <div class="formation-status-wrap" onclick="if(window.triggerFormationAction) triggerFormationAction(); else send('formation toggle');" style="cursor: pointer;" title="點擊切換結成之道門陣法 (F)">
        <div id="formation-info" class="formation-info">
          <span class="formation-name">☯️ 陣法：【未結陣】</span>
          <span class="formation-energy-val">靈威: 0/100</span>
        </div>
        <div class="formation-bar-container">
          <div id="formation-bar" class="formation-bar-fill" style="width: 0%"></div>
        </div>
        <button id="ult-btn" class="ult-trigger-btn" onclick="event.stopPropagation(); send('formation cast')" title="釋放陣法奧義大招 (U)">⚡ 陣法奧義</button>
      </div>
    </header>

    <!-- 主畫面視窗：可切換左側/右側停靠的地牢雷達，右側冒險文字日誌 -->
    <main class="main-viewport">
      <aside id="dungeon-radar-panel" class="dungeon-radar-panel">
        <div class="radar-top-controls">
          <button id="radar-dock-toggle-btn" class="radar-mini-btn" onclick="toggleRadarPosition()" title="切換地圖左側/右側停靠">⮃ 換邊</button>
          <button id="radar-mode-toggle-btn" class="radar-mini-btn" onclick="toggleRadarViewMode()" title="切換居中跟隨/全圖俯瞰視野">🎯 視口</button>
        </div>

        <div id="drpg-floor-info" class="radar-header">
          <span class="floor-title">🏛️ 太陰古塚一層 (B1F)</span>
          <span class="coord-tag">[X: 1, Y: 1]</span>
          <span class="facing-tag">朝向: <strong class="arrow-glow">▲</strong> 北</span>
        </div>

        <div class="radar-grid-container">
          <div id="drpg-grid" class="radar-grid">
            <!-- 由 drpg-view.js 動態渲染地塊 -->
          </div>
        </div>

        <div id="drpg-forward-inspect" class="forward-inspect-card">
          【正前方】凝神探查中...
        </div>
      </aside>

      <!-- 右側主體：戰場敵方陣列 + 戰鬥冒險日誌 -->
      <div class="log-and-battle-area">
        <!-- 戰鬥交鋒面板 (戰鬥時動態顯示) -->
        <section id="battle-arena-panel" class="battle-arena-panel hidden">
          <div class="battle-arena-header">
            <div class="battle-header-left">
              <span class="battle-title">⚔️ 太陰地宮・交鋒戰場</span>
              <span id="battle-status-badge" class="battle-status-badge">戰鬥交鋒中</span>
            </div>
            <div class="battle-header-right">
              <span class="battle-tip">點擊敵怪可鎖定集火目標，點擊下方隊員可施放專屬招式</span>
            </div>
          </div>
          <div id="battle-enemies-container" class="battle-enemies-container">
            <!-- 由 drpg-view.js 動態渲染敵方前排與後排 -->
          </div>
        </section>

        <section id="log"></section>
      </div>
    </main>

    <!-- 下部：6 人小隊狀態 HUD -->
    <section class="party-hud-panel">
      <div id="party-members-list" class="party-members-list">
        <!-- 由 drpg-view.js 動態渲染 6 名小隊成員卡片 -->
      </div>
    </section>

    <!-- 隊員專屬技能盤 / 抽屜 (點選隊員卡片滑出) -->
    <section id="skill-drawer" class="skill-drawer hidden">
      <!-- 由 drpg-view.js 動態渲染所選隊員的技能按鈕、能量消耗與 CD 倒數 -->
    </section>

    <!-- 隊伍公共行囊抽屜 (可隨時點擊或按 B 開關) -->
    <section id="bag-drawer" class="bag-drawer hidden">
      <div class="bag-drawer-header">
        <div class="bag-header-title">
          <span>🎒 隊伍公共行囊</span>
          <span id="bag-capacity-badge" class="bag-capacity-badge">0/30</span>
        </div>
        <button class="drawer-close-btn" onclick="toggleBagDrawer(false)">✕ 關閉 (B)</button>
      <div id="bag-items-list" class="bag-items-list">
        <!-- 由 drpg-view.js 動態渲染 -->
      </div>
    </section>

    <!-- 單機存檔 / 讀檔 / 開闢新途 模態視窗 -->
    <div id="save-modal" class="modal-overlay hidden" onclick="if(event.target===this) closeSaveModal();">
      <div class="save-modal-card">
        <div class="save-modal-header">
          <div class="save-modal-title">
            <span id="save-modal-mode-title">📂 仙道命冊・單機存檔管理</span>
          </div>
          <button class="drawer-close-btn" onclick="closeSaveModal()">✕ 關閉 (Esc)</button>
        </div>

        <div class="save-new-game-box">
          <span class="new-game-label">✨ 開闢新道途：</span>
          <input type="text" id="new-protagonist-input" class="new-protagonist-field" placeholder="輸入主角道號 (預設: 玄靈子)" maxlength="12">
          <button class="act-btn btn-new-game" onclick="triggerNewGame()">啟程新道途</button>
        </div>

        <div id="save-slots-list" class="save-slots-list">
          <!-- 由 drpg-view.js 動態渲染 Slot 0..5 -->
        </div>
      </div>
    </div>

    <!-- 底部操作列：十字步進盤、快捷功能按鍵與文字指令輸入 -->
    <footer class="bottom-control-panel">
      <div class="quick-dpad-wrap">
        <div class="dpad-grid">
          <button class="dpad-btn dpad-forward" onclick="if(window.sendStep) sendStep('w'); else send('step w');" title="前進 (W)">▲</button>
          <button class="dpad-btn dpad-left" onclick="if(window.sendStep) sendStep('a'); else send('step a');" title="左轉 90度 (A)">◀</button>
          <button class="dpad-btn dpad-backward" onclick="if(window.sendStep) sendStep('s'); else send('step s');" title="後退 (S)">▼</button>
          <button class="dpad-btn dpad-right" onclick="if(window.sendStep) sendStep('d'); else send('step d');" title="右轉 90度 (D)">▶</button>
        </div>

        <!-- 探索模式按鍵組 -->
        <div id="action-buttons-group" class="action-buttons-group">
          <button class="act-btn" onclick="if(window.triggerPartyAction) triggerPartyAction(); else send('party');" title="檢視/同步小隊狀態 (P)">👥 小隊 (P)</button>
          <button class="act-btn btn-bag" onclick="toggleBagDrawer()" title="開啟隊伍公共行囊 (B)">🎒 行囊 (B)</button>
          <button class="act-btn" onclick="openSaveModal('load')" title="開啟單機存檔/讀檔面板">💾 存讀檔</button>
          <button class="act-btn" onclick="if(window.triggerFormationAction) triggerFormationAction(); else send('formation toggle');" title="切換道門陣法 (F)">☯️ 陣法 (F)</button>
          <button class="act-btn" onclick="if(window.triggerInspectAction) triggerInspectAction(); else send('dungeon look');" title="凝神探查正前方地塊 (I)">👁️ 探查 (I)</button>
          <button class="act-btn" onclick="if(window.triggerRestAction) triggerRestAction(); else send('rest');" title="凝神調息回復氣血與真元 (R)">🌿 休息 (R)</button>
          <button class="act-btn btn-dummy" onclick="send('battle test')" title="召喚玄鐵試道傀儡 (攻極低血極厚，試招用)">🎯 試道木樁</button>
          <button class="act-btn btn-charge" onclick="send('battle charge')" title="靈威充能 100 點，滿怒氣/連擊點/真元 (試招奧義用)">⚡ 充能</button>
        </div>

        <!-- 戰鬥模式按鍵組 (平時隱藏) -->
        <div id="battle-buttons-group" class="action-buttons-group hidden">
          <button class="act-btn btn-fight" onclick="send('battle fight')" title="全隊集火主動迎戰 (Space)">⚔️ 迎戰 (Space)</button>
          <button class="act-btn btn-bag" onclick="toggleBagDrawer()" title="戰鬥中開啟隊伍行囊使用丹藥/法寶 (B)">🎒 行囊 (B)</button>
          <button class="act-btn btn-flee" onclick="send('battle flee')" title="遁地撤退 (-5 SAN) (Esc)">🏃 遁地 (Esc)</button>
          <button class="act-btn btn-ult" onclick="send('formation cast')" title="釋放小隊陣法專屬奧義 (U)">⚡ 陣法奧義 (U)</button>
          <button class="act-btn btn-charge" onclick="send('battle charge')" title="戰鬥中充能滿 100 靈威與隊員戰意">⚡ 充能</button>
          <button class="act-btn" onclick="send('party')" title="檢視小隊詳細戰況 (P)">👥 小隊 (P)</button>
        </div>
      </div>

      <div class="input-container">
        <input type="text" id="cmd-input" class="cmd-input-field" placeholder="按 / 或 Enter 輸入文字指令，Esc 切回步進..." autocomplete="off">
        <button class="send-btn" onclick="handleEnter()">發送</button>
      </div>
    </footer>
  </div>

  <script src="js/mud-core.js"></script>
  <script src="js/mud-ui.js"></script>

  <script>
    let ws = null;
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host || 'localhost:8080';
      const socketUrl = `${protocol}//${host}/ws`;

      ws = new WebSocket(socketUrl);
      ws.onopen = () => {
        appendHtml("系統：神識已連結至太陰地宮！", "#10b981");
      };
      ws.onclose = () => {
        appendHtml("系統：靈識中斷，3秒後嘗試凝神重連...", "#ef4444");
        setTimeout(connect, 3000);
      };
      ws.onmessage = (event) => handleServerMessage(event.data);
    }

    function send(cmd) {
      if (!cmd || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "INPUT", text: cmd }));
      // 指令步進不需洗版文字日誌，僅特別指令記錄
      if (!cmd.startsWith('step ')) {
        appendHtml("> " + cmd, "#6b7280");
      }
    }

    window.send = send;
    connect();
  </script>
  <script src="js/drpg-view.js"></script>
</body>
</html>
